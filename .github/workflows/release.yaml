name: Release Module

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7/

      - name: Create Zip
        working-directory: ./dist/TecticPS/
        run: |
          pwd
          ls
          ls ../../
          zip -r ../../TecticPS.${{ github.ref_name }}.zip

      - name: Invoke Pester
        shell: pwsh
        run: Invoke-Pester -CI -Passthru

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: TecticPS.${{ github.ref_name }}.zip
          generate_release_notes: true

      - name: Publish Module
        shell: pwsh
        env:
          API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: Publish-Module -Path ./dist/TecticPS/ -NuGetApiKey $env:API_KEY -Verbose
