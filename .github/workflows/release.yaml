name: Release Module
run-name: Release ${{ github.ref_name }} by ${{github.actor}}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Invoke Pester
        shell: pwsh
        run: Invoke-Pester -CI -Passthru

      - name: Create Zip
        working-directory: ./dist/TecticPS/
        run: zip ../../TecticPS.${{ github.ref_name }}.zip *

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: TecticPS.${{ github.ref_name }}.zip
          generate_release_notes: true

      - name: Publish Module
        shell: pwsh
        env:
          API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: Publish-Module -Path ./dist/TecticPS/ -NuGetApiKey $env:API_KEY
