name: Code Testing
run-name: Testing ${{ github.ref_name }} by ${{github.actor}}

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Pester
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Invoke Pester
        shell: pwsh
        run: Invoke-Pester -CI -Passthru

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testResults.xml
          path: testResults.xml
